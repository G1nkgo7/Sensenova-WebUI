[project]
name = "pptagent-static-web-demo-studio"
version = "0.1.0"
description = "Studio web UI for pptagent_static_web_demo"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43.0",
    "fastapi>=0.115",
    "fonttools[woff]>=4.56",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "openpyxl>=3.1",
    "pillow>=10.0",
    "playwright>=1.40",
    "pymupdf>=1.24",
    "pypdf>=4.0",
    "python-dotenv>=1.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "python-pptx>=1.0.2",
    "requests>=2.32",
]

# DB (sqlite3), password hashing (hashlib.scrypt), session tokens (secrets)
# are all stdlib — no extra deps for auth/storage.

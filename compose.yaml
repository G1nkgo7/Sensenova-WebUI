services:
  sensenova-present:
    build: .
    ports:
      - "${SENSE_NOVA_LOCAL_PORT:-8001}:8001"
    env_file:
      - path: .env
        required: false
    environment:
      SENSE_NOVA_LOCAL_HOST: 0.0.0.0
      SENSE_NOVA_LOCAL_PORT: 8001
    volumes:
      - sensenova-present-data:/data
    healthcheck:
      test: ["CMD", "/app/studio/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  sensenova-present-data:
